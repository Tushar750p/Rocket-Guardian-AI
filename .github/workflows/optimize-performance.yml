name: Optimize App Performance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Optimize and complete dashboard
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/dashboard.py")
          text = path.read_text(encoding="utf-8")

          marker = "# PERFORMANCE CACHE HELPERS"
          if marker not in text:
              anchor = 'SENSORS = {'
              insert_at = text.index(anchor)
              helpers = '''# ============================================================\n# PERFORMANCE CACHE HELPERS\n# ============================================================\n\n@st.cache_resource(show_spinner=False)\ndef _initialize_database_cached():\n    initialize_database()\n\n\n@st.cache_data(show_spinner=False)\ndef _read_csv_cached(file_path: str):\n    return pd.read_csv(file_path)\n\n\n@st.cache_data(show_spinner=False)\ndef _analyze_telemetry_cached(uploaded_bytes: bytes):\n    fd, temp_path = tempfile.mkstemp(suffix=".csv")\n    try:\n        with os.fdopen(fd, "wb") as temp_file:\n            temp_file.write(uploaded_bytes)\n        return analyze_telemetry(temp_path)\n    finally:\n        if os.path.exists(temp_path):\n            os.remove(temp_path)\n\n\n@st.cache_data(show_spinner=False)\ndef _analyze_risk_cached(frame):\n    return analyze_risk(frame)\n\n\n'''
              text = text[:insert_at] + helpers + text[insert_at:]

          text = text.replace("initialize_database()\n\n# ============================================================\n# AUTHENTICATION", "_initialize_database_cached()\n\n# ============================================================\n# AUTHENTICATION", 1)
          text = text.replace("data = analyze_telemetry(\n                temp_path\n            )", "data = _analyze_telemetry_cached(uploaded_bytes)", 1)
          text = text.replace("risk_data = analyze_risk(\n            data\n        )", "risk_data = _analyze_risk_cached(data)", 1)
          text = text.replace("data = pd.read_csv(\n        file_path\n    )", "data = _read_csv_cached(str(file_path))", 1)
          text = text.replace("risk_data = pd.read_csv(\n            risk_file\n        )", "risk_data = _read_csv_cached(str(risk_file))", 1)

          if "get_customer_mission_history," not in text:
              text = text.replace("    get_customer_by_auth_user_id,\n", "    get_customer_by_auth_user_id,\n    get_customer_mission_history,\n", 1)

          # Keep the live agent block stable and add a visible realtime monitor.
          if "Real-Time Stream Monitor" not in text:
              anchor = '    st.info(live_agents["mission"]["recommendation"])\n'
              realtime = '''    st.info(live_agents["mission"]["recommendation"])\n\n    st.markdown("### Real-Time Stream Monitor")\n    latest_live = risk_data.iloc[-1]\n    rt_cols = st.columns(5)\n    with rt_cols[0]:\n        st.metric("Stream Time", f'{float(latest_live["time_s"]):.2f} s')\n    with rt_cols[1]:\n        st.metric("Pressure", f'{float(latest_live["pressure_kpa"]):.2f} kPa')\n    with rt_cols[2]:\n        st.metric("Temperature", f'{float(latest_live["temperature_k"]):.2f} K')\n    with rt_cols[3]:\n        st.metric("Vibration", f'{float(latest_live["vibration_g"]):.3f} g')\n    with rt_cols[4]:\n        st.metric("Thrust", f'{float(latest_live["thrust_n"]):.1f} N')\n\n    live_risk_series = risk_data[["time_s", "overall_risk"]].tail(120)\n    live_risk_fig = go.Figure()\n    live_risk_fig.add_trace(go.Scatter(x=live_risk_series["time_s"], y=live_risk_series["overall_risk"], mode="lines+markers", name="Overall Risk"))\n    live_risk_fig.add_hline(y=75, line_dash="dash", annotation_text="CRITICAL")\n    live_risk_fig.add_hline(y=45, line_dash="dot", annotation_text="WARNING")\n    live_risk_fig.update_layout(title="Live Risk Stream (latest 120 samples)", xaxis_title="Telemetry Time (s)", yaxis_title="Risk / 100", yaxis_range=[0, 100], height=320)\n    st.plotly_chart(live_risk_fig, width="stretch")\n'''
              if anchor not in text:
                  raise SystemExit("Live agent recommendation anchor not found")
              text = text.replace(anchor, realtime, 1)

          if "# MISSION HISTORY\n# ============================================================" not in text:
              anchor = "# ============================================================\n# OVERALL SYSTEM STATUS\n# ============================================================\n"
              history = '''# ============================================================\n# MISSION HISTORY\n# ============================================================\n\nif customer_mode:\n    st.divider()\n    st.subheader("Mission History")\n    try:\n        history_customer = get_customer_by_auth_user_id(current_user.id)\n        if history_customer is not None:\n            history_rows = get_customer_mission_history(int(history_customer["id"]))\n            history_items = []\n            for row in history_rows:\n                history_items.append({\n                    "Mission": row["mission_name"],\n                    "File": row["source_filename"] or "-",\n                    "Samples": row["sample_count"] if row["sample_count"] is not None else "-",\n                    "AI Detections": row["ai_detection_count"] if row["ai_detection_count"] is not None else "-",\n                    "Risk": f'{float(row["overall_risk"]):.1f}/100' if row["overall_risk"] is not None else "-",\n                    "Status": row["risk_level"] or "-",\n                    "Primary Sensor": row["primary_risk_sensor"] or "-",\n                    "Peak Time (s)": f'{float(row["peak_time_s"]):.2f}' if row["peak_time_s"] is not None else "-",\n                    "Saved At": str(row["run_created_at"] or row["mission_created_at"]),\n                })\n            if history_items:\n                st.dataframe(pd.DataFrame(history_items), width="stretch", hide_index=True)\n            else:\n                st.info("No saved mission history yet.")\n        else:\n            st.info("Mission history will appear after the first saved analysis.")\n    except Exception as exc:\n        st.warning(f"Mission history unavailable: {exc}")\n\n'''
              if anchor not in text:
                  raise SystemExit("Overall status anchor not found")
              text = text.replace(anchor, history + anchor, 1)

          path.write_text(text, encoding="utf-8")
          print("Dashboard optimization + live history/realtime UI applied.")

      - name: Validate optimized dashboard
        run: python -m compileall -q src/dashboard.py src/database.py src/live_stream.py src/live_telemetry.py src/ai_agents.py

      - name: Commit optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard.py
          if git diff --cached --quiet; then
            echo "No dashboard changes needed."
          else
            git commit -m "Upgrade live dashboard with history and realtime monitoring"
            git push origin HEAD:main
          fi
