name: Fix Live PDF Report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix live PDF paragraph expression
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/dashboard.py")
          text = path.read_text(encoding="utf-8")
          broken = " </b>. '<\n        f'<b>"
          fixed = " </b>. '\n        f'<b>"
          if broken not in text:
              print("Live PDF expression already fixed or not present.")
          else:
              path.write_text(text.replace(broken, fixed, 1), encoding="utf-8")
              print("Fixed live PDF Paragraph string comparison bug.")

      - name: Validate Python files
        run: python -m compileall -q src

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard.py
          if git diff --cached --quiet; then
            echo "No fix needed."
          else
            git commit -m "Fix live mission PDF report"
            git push origin HEAD:main
          fi
